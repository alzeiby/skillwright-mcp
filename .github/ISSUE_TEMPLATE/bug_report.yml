name: Bug report
description: Report reproducible incorrect behavior in Skillwright
title: "[bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please include the smallest reproduction you can. Do not include passwords, tokens, or other secrets.

  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the relevant MCP calls, workflow, or minimal test case.
      render: text
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.1.0 or commit SHA
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: 3.12.10
    validations:
      required: true

  - type: input
    id: client
    attributes:
      label: MCP client
      placeholder: Codex, Claude Code, VS Code, OpenCode, etc.

  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Remove secrets and private data before posting.
      render: text
