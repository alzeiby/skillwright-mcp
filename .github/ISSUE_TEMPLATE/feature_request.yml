name: Feature request
description: Propose a focused addition or change
title: "[feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: What browser workflow or MCP use case is currently difficult or impossible?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest interface or behavior change that would address the use case.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Note any workaround or existing tool you considered.
