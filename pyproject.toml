[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "skillwright-mcp"
version = "0.1.0"
description = "Persistent, deterministic browser skills built on Microsoft's Playwright MCP server."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }
authors = [{ name = "Abdullah Alzeiby" }]
dependencies = [
  "aiosqlite>=0.21,<1",
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "mcp>=2.0,<3",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0.43,<3",
  "taskiq>=0.12,<0.13",
  "taskiq-redis>=1.2,<2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
skillwright-mcp = "skillwright_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/skillwright_mcp"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["skillwright_mcp"]
exclude = ["alembic"]

